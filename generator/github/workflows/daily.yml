
name: Daily Hindi Kids Animation

"on":
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate story
        run: python generator/story.py

      - name: Generate voice
        run: python generator/voice.py

      - name: Generate music
        run: python generator/music.py

      - name: Generate scenes
        run: python generator/scenes.py

      - name: Generate subtitles
        run: python generator/subtitles.py

      - name: Render video
        run: python generator/render.py

      - name: Create thumbnail
        run: python generator/thumbnail.py

      - name: Upload to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python generator/youtube.py

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: hindi-kids-video
          path: output/
          if-no-files-found: error
          retention-days: 7
